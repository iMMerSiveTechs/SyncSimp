name: Credential hygiene (tracked env and key logging)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  credential-hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reject tracked environment files and raw-key logging
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import re
          import subprocess
          import sys

          allowed_examples = {".env.example", ".env.sample", ".env.template"}

          def forbidden_env(path):
              name = PurePosixPath(path).name
              return (name == ".env" or name.startswith(".env.")) and name not in allowed_examples

          # Synthetic positive and negative cases test the rule itself, without real credentials.
          fixtures = {
              "backend/.env": True,
              "backend/.env.production": True,
              ".env.local": True,
              "backend/.env.example": False,
              "README.md": False,
          }
          for path, should_reject in fixtures.items():
              assert forbidden_env(path) == should_reject

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          violations = sum(bool(entry) and forbidden_env(entry.decode("utf-8", "surrogateescape"))
                           for entry in tracked)
          if violations:
              print(f"FAIL: {violations} tracked environment configuration file(s); values suppressed")
              sys.exit(1)

          test_script = Path("backend/test-secret-key.ts")
          if not test_script.is_file():
              print("FAIL: expected credential test script missing")
              sys.exit(1)
          unsafe_logs = sum(
              bool(re.search(r"console\.(?:log|info|warn|debug|error)\s*\(", line))
              and bool(re.search(r"\bapiKey\b", line))
              for line in test_script.read_text(encoding="utf-8").splitlines()
          )
          if unsafe_logs:
              print(f"FAIL: {unsafe_logs} potential credential logging line(s); values suppressed")
              sys.exit(1)

          print("PASS: no tracked .env files or direct API-key console logs")
          PY
